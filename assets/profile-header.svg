<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Tomoya0k — Sebastián Macías</title>
  <desc id="desc">Código, ideas y cosas que voy construyendo. Ilustración orbital en cian y violeta sobre fondo oscuro.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101523"/><stop offset="1" stop-color="#19142b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ee7f9"/><stop offset=".5" stop-color="#9c91ff"/><stop offset="1" stop-color="#d4a6ff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7962de" stop-opacity=".22"/><stop offset="1" stop-color="#7962de" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a7b5e3" stroke-opacity=".045"/></pattern>
    <clipPath id="frame"><rect width="1000" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .orbital{transform-origin:828px 158px;animation:orbit 32s linear infinite}
    .spark{animation:twinkle 4s ease-in-out infinite alternate}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes twinkle{from{opacity:.3}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.orbital,.spark{animation:none}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#background)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <circle cx="825" cy="160" r="240" fill="url(#halo)"/>
    <rect width="1000" height="3" fill="url(#accent)"/>
    <g class="orbital" fill="none" stroke="url(#accent)">
      <circle cx="828" cy="158" r="91" opacity=".3"/>
      <circle cx="828" cy="158" r="65" opacity=".2"/>
      <ellipse cx="828" cy="158" rx="132" ry="44" transform="rotate(-32 828 158)" opacity=".7"/>
      <ellipse cx="828" cy="158" rx="132" ry="44" transform="rotate(48 828 158)" opacity=".38"/>
      <path d="m828 119 34 39-34 39-34-39z" stroke-width="2"/>
      <path d="m813 150-8 8 8 8m30-16 8 8-8 8m-19 8 8-32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle class="spark" cx="939" cy="98" r="5" fill="#75e1f3"/>
    <circle cx="760" cy="61" r="3" fill="#c3a0ff"/>
    <path d="M699 226v12m-6-6h12M942 244v10m-5-5h10" stroke="#aaa1e8" stroke-width="1.5"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="48" y="61" fill="#98a4c5" font-size="14" font-weight="600" letter-spacing="3">PERSONAL SPACE / GITHUB</text>
      <text x="43" y="150" fill="#f3f2ff" font-size="78" font-weight="800" letter-spacing="-3">TOMOYA0K<tspan fill="#7ce5ef">.</tspan></text>
      <text x="48" y="189" fill="#c9c6e4" font-size="22">Sebastián Macías</text>
      <text x="48" y="242" fill="#a1aec9" font-size="19">Código, ideas y cosas que voy construyendo.</text>
      <text x="48" y="284" fill="#82d5df" font-family="Consolas, monospace" font-size="13" letter-spacing="1">&gt; build · break · learn · repeat _</text>
    </g>
  </g>
</svg>
